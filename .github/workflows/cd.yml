# Pipeline de Entrega/Implantacao Continua (CD) do CondoConecta
# Referenciado na secao 6 do PGCS.
#
# Disparo manual por enquanto (workflow_dispatch), ate que exista uma
# imagem publicada para promover entre ambientes.

name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Etapas previstas
        run: |
          echo "1. Deploy em Homologacao (Render)"
          echo "2. Testes de aceitacao em staging"
          echo "3. Gate de aprovacao manual para producao"
          echo "4. Deploy em Producao (rolling update)"
          echo "5. Smoke tests e health check"
          echo "6. Geracao de tag de release"
