# Pipeline de Entrega/Implantacao Continua (CD) do CondoConecta
# Referenciado na secao 6 do PGCS.

name: CD

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy em Homologacao
        run: echo "Deploy em staging (Render)"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Deploy em Producao
        run: echo "Deploy em producao, apos aprovacao do revisor"
